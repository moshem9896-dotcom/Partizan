<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PartizaN Empire</title>
    <!-- חיבור לאייקונים של Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #02040a;
            --primary-blue: #00f2fe; /* כחול ניאון */
            --accent-blue: #0072ff; /* כחול עמוק */
            --card-base: rgba(10, 17, 34, 0.7);
            --card-border: rgba(0, 242, 254, 0.15);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 114, 255, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(0, 242, 254, 0.1) 0%, transparent 50%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
        }

        /* חלקיקים זוהרים מרחפים ברקע (אפקט קוסמי) */
        .bg-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: rgba(0, 242, 254, 0.4);
            border-radius: 50%;
            animation: floatUp 8s infinite linear;
        }

        /* יצירת מגוון חלקיקים בגדלים שונים */
        .particle:nth-child(1) { width: 4px; height: 4px; left: 15%; animation-delay: 0s; animation-duration: 12s; }
        .particle:nth-child(2) { width: 6px; height: 6px; left: 45%; animation-delay: 2s; animation-duration: 15s; }
        .particle:nth-child(3) { width: 3px; height: 3px; left: 75%; animation-delay: 4s; animation-duration: 10s; }
        .particle:nth-child(4) { width: 5px; height: 5px; left: 85%; animation-delay: 1s; animation-duration: 14s; }
        .particle:nth-child(5) { width: 4px; height: 4px; left: 30%; animation-delay: 5s; animation-duration: 11s; }

        @keyframes floatUp {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* אנימציות כניסה חלקה של האלמנטים */
        @keyframes fadeInBlur {
            from { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(0, 242, 254, 0.3), inset 0 0 15px rgba(0, 242, 254, 0.2); }
            50% { box-shadow: 0 0 25px rgba(0, 242, 254, 0.6), inset 0 0 20px rgba(0, 242, 254, 0.4); }
            100% { box-shadow: 0 0 15px rgba(0, 242, 254, 0.3), inset 0 0 15px rgba(0, 242, 254, 0.2); }
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            z-index: 1;
            animation: fadeInBlur 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* עיצוב מעטפת הפרופיל */
        .profile-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
            width: 120px;
            height: 120px;
        }

        /* הילה כחולה מטורפת סביב הלוגו */
        .profile-glow-effect {
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background: linear-gradient(45deg, var(--primary-blue), var(--accent-blue));
            border-radius: 50%;
            z-index: -1;
            filter: blur(8px);
            opacity: 0.85;
            animation: pulseGlow 3s infinite ease-in-out;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            object-fit: cover;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
            display: block;
        }

        /* תצוגת אות גיבוי במידה והתמונה לא נטענת */
        .profile-fallback {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            background: radial-gradient(circle, var(--accent-blue) 0%, var(--bg-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 54px;
            font-weight: 900;
            color: var(--primary-blue);
            text-shadow: 0 0 15px var(--primary-blue);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
        }

        h1 {
            font-size: 30px;
            margin: 15px 0 5px 0;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 30%, var(--primary-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(0, 242, 254, 0.2);
        }

        .subtitle {
            color: var(--primary-blue);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 40px;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* כפתורי זכוכית מעוצבים כחול-ניאון */
        .btn {
            background: var(--card-base);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 18px 24px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            animation: fadeInBlur 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* אנימציה מדורגת להופעת הכפתורים */
        .btn:nth-child(1) { animation-delay: 0.1s; }
        .btn:nth-child(2) { animation-delay: 0.2s; }
        .btn:nth-child(3) { animation-delay: 0.3s; }
        .btn:nth-child(4) { animation-delay: 0.4s; }
        .btn:nth-child(5) { animation-delay: 0.5s; }
        .btn:nth-child(6) { animation-delay: 0.6s; }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* עיצוב האייקונים הגדולים */
        .btn i.brand-icon {
            font-size: 24px;
            width: 30px;
            text-align: center;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .kick-custom-icon {
            font-weight: 900;
            font-style: normal;
            font-size: 20px;
            width: 30px;
            text-align: center;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .chevron {
            font-size: 12px;
            color: var(--text-sub);
            transition: transform 0.3s ease, color 0.3s ease;
        }

        /* צבעי אייקונים ברקע כברירת מחדל */
        .fa-youtube { color: #ff0000; }
        .fa-tiktok { color: #00f2fe; }
        .fa-instagram { color: #e1306c; }
        .fa-discord { color: #5865f2; }
        .kick-color { color: #53fc18; }

        /* אפקט ריחוף ולחיצה כללי שמתאים לכחול ניאון */
        .btn:hover, .btn:active {
            background: rgba(0, 242, 254, 0.08);
            border-color: var(--primary-blue);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.25);
        }

        /* הגדלה קלה של האייקונים בריחוף */
        .btn:hover i.brand-icon, .btn:active i.brand-icon,
        .btn:hover .kick-custom-icon, .btn:active .kick-custom-icon {
            transform: scale(1.15);
            text-shadow: 0 0 10px currentColor;
        }

        /* חץ זז שמאלה בריחוף */
        .btn:hover .chevron, .btn:active .chevron {
            transform: translateX(-6px);
            color: var(--primary-blue);
        }

        /* עיצוב כותרת התחתית המשודרגת */
        .footer-tag {
            margin-top: 60px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #cca152, #fff, #cca152);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.9;
            text-shadow: 0 2px 10px rgba(204, 161, 82, 0.3);
            display: inline-block;
            position: relative;
        }

        .footer-tag::after, .footer-tag::before {
            content: '';
            position: absolute;
            top: 50%;
            width: 25px;
            height: 1px;
            background: #cca152;
        }

        .footer-tag::before { right: -35px; }
        .footer-tag::after { left: -35px; }
    </style>
</head>
<body>

    <!-- אפקט חלקיקים זוהרים ברקע -->
    <div class="bg-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        
        <div class="profile-container">
            <div class="profile-glow-effect"></div>
            <!-- זכור להעלות את תמונת הלוגו לגיטהאב ולקרוא לה בדיוק profile.jpg -->
            <img src="profile.jpg" alt="PartizaN" class="profile-pic" onerror="this.style.display='none'; document.getElementById('fallback-avatar').style.display='flex';">
            <div id="fallback-avatar" class="profile-fallback" style="display: none;">P</div>
        </div>

        <h1>PARTIZAN</h1>
        <div class="subtitle">Official Bio</div>

        <div class="links-container">
            
            <!-- 1. יוטיוב -->
            <a href="https://youtube.com/@partizanyt?si=tMghgjRiHxWrb5j9" target="_blank" class="btn">
                <div class="btn-content">
                    <i class="fab fa-youtube brand-icon"></i>

            <a href="https://kick.com/partizanktv" target="_blank" class="btn">
                <div class="btn-content">

                    <span>ערוץ ה-Kick</span>
                </div>

            </a>

            <!-- 3. טיקטוק -->
            <a href="https://www.tiktok.com/@oryan_azulay?_r=1&_t=ZS-97LtX046qcq" target="_blank" class="btn">
                <div class="btn-content">
                    <i class="fab fa-tiktok brand-icon"></i>
                    <span>ערוץ הטיקטוק</span>
                </div>
                <i class="fas fa-chevron-left chevron"></i>
            </a>

            <!-- 4. אינסטגרם -->
            <a href="https://www.instagram.com/oryan_azulay/" target="_blank" class="btn">
                <div class="btn-content">
                    <i class="fab fa-instagram brand-icon"></i>
                    <span>אינסטגרם</span>
                </div>
                <i class="fas fa-chevron-left chevron"></i>
            </a>

            <!-- 5. דיסקורד ערוץ -->
            <a href="https://discord.gg/MgGAxr6kwA" target="_blank" class="btn">
                <div class="btn-content">
                    <i class="fab fa-discord brand-icon"></i>
                    <span>שרת הדיסקורד של הערוץ</span>
                </div>
                <i class="fas fa-chevron-left chevron"></i>
            </a>

            <!-- 6. דיסקורד שרת פייבאם -->
            <a href="https://discord.gg/prrp" target="_blank" class="btn">
                <div class="btn-content">
                    <i class="fab fa-discord brand-icon"></i>
                    <span>שרת הדיסקורד של שרת פייבאם</span>
                </div>
                <i class="fas fa-chevron-left chevron"></i>
            </a>

        </div>

        <!-- התחתית החדשה בדיוק כפי שביקשת -->
        <div class="footer-tag">PartizaN Empire</div>
    </div>

</body>
</html>
